name: Verify Actions Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify workflow dependencies
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
