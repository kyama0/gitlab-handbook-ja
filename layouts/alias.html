<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ .Permalink }}">
    <script>
      window.location.replace({{ .Permalink | jsonify | safeJS }} + window.location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
    <title>{{ .Title }} は移動しました</title>
  </head>
  <body>
    <p><a href="{{ .Permalink }}">{{ .Title }} は移動しました。新しいページへ移動します。</a></p>
  </body>
</html>
